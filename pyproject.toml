[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rimi-tests"
version = "0.1.0"
description = "Test runner for the rimi. open convention — reliability rules, many models, one report"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Hiram" }]
keywords = ["llm", "evaluation", "testing", "reliability", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "litellm>=1.50",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "click>=8.1",
  "rich>=13.7",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/rimi-ai/rimi.tests"
Convention = "https://github.com/rimi-ai/rimi.convention"
Documentation = "https://github.com/rimi-ai/rimi.tests/tree/main/docs"

[project.scripts]
rimi = "rimi_tests.cli:main"

# Third parties add their own checks by declaring this entry point group.
[project.entry-points."rimi_tests.checks"]

[tool.hatch.build.targets.wheel]
packages = ["src/rimi_tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
