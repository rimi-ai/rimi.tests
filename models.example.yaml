# Copy to models.yaml and keep it out of git. Keys are read from the environment,
# never from this file and never written to a run.
#
#   export ANTHROPIC_API_KEY=...   OPENAI_API_KEY=...   MISTRAL_API_KEY=...
#
# `litellm_id` is what LiteLLM expects; `name` is what appears in reports.
# Pin a dated version whenever the provider offers one: a report names the exact model.

models:
  - name: claude-sonnet-5
    litellm_id: anthropic/claude-sonnet-5
    provider: anthropic
    # this model accepts only temperature=1; a model's own constraints are declared
    # here and win over the case, and the report records what was actually sent
    params: { temperature: 1, max_tokens: 1024 }

  - name: gpt-4o-2024-11-20
    litellm_id: openai/gpt-4o-2024-11-20
    provider: openai
    params: { temperature: 0.0, max_tokens: 1024 }

  - name: gemini-3.6-flash
    litellm_id: gemini/gemini-3.6-flash
    provider: google
    params: { temperature: 0.0, max_tokens: 1024 }

  - name: mistral-large-2411
    litellm_id: mistral/mistral-large-2411
    provider: mistral
    params: { temperature: 0.0, max_tokens: 1024 }

  - name: llama-3.3-70b
    litellm_id: groq/llama-3.3-70b-versatile
    provider: groq
    params: { temperature: 0.0, max_tokens: 1024 }

# The dev profile takes the first model of the list unless --model says otherwise.
